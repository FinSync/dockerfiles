name: Publish rails image

on:
  push:
    branches: [master]
    paths:
      - rails/**
      - .github/workflows/publish-rails-image.yml
  workflow_dispatch:

concurrency:
  group: publish-rails-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve tags
        id: tags
        run: |
          ruby_version=$(sed -nE 's|^FROM cimg/ruby:([0-9.]+).*|\1|p' rails/Dockerfile)
          if [ -z "$ruby_version" ]; then
            echo "Could not parse Ruby version from rails/Dockerfile" >&2
            exit 1
          fi
          image=ghcr.io/finsync/dockerfiles
          {
            echo "tags<<EOF"
            echo "$image:rails-ruby$ruby_version"
            echo "$image:rails-ruby$ruby_version-${GITHUB_SHA::7}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: rails
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
